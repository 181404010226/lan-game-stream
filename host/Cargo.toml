[package]
name = "lan-stream-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
stream-wire = { path = "../wire" }
vigem-client = "0.1.4"
wasapi = "0.27"
windows = { version = "0.62", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture"
] }
windows-capture = "2.0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_QoS", "Win32_Networking_WinSock",
    "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
cc = "1"
